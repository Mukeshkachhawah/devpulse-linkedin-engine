mode = "auto"

[routing.defaults]
provider = "codex"
model = "gpt-5.6-terra"

[skills]
paths = [".agents/skills"]

[adapters.backlog.scripts]
sync = "adapters/backlog-sync"
add = "adapters/backlog-add"
done = "adapters/backlog-done"
edit = "adapters/backlog-edit"

[concurrency]
max_concurrency = 1

[runtime]
default = "process"

[runtime.process]
max_concurrent = 1

[server]
port = 3000
enabled = true
