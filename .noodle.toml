mode = "auto"

[routing.defaults]
provider = "codex"
model = "gpt-5.4"

[skills]
paths = [".agents/skills"]

[adapters.backlog.scripts]
sync = "adapters/backlog-sync.cmd"
add = "adapters/backlog-add.cmd"
done = "adapters/backlog-done.cmd"
edit = "adapters/backlog-edit.cmd"

[concurrency]
max_concurrency = 1

[runtime]
default = "process"

[runtime.process]
max_concurrent = 1

[server]
port = 3000
enabled = true
